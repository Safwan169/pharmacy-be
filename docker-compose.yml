# The whole shop on one machine: database, API, counter screen, a nightly
# backup and a copy of it off the machine.
#
# The frontend lives in its own repository, so clone the two side by side and
# run this from here:
#
#   pharmacy/
#     pharmacy-nest-backend/   <- docker compose up -d --build
#     pharmacy-fe/
#
# Settings come from .env in this folder (copy .env.example). The values that
# only make sense inside Docker are set below and win over anything in .env,
# so a file left pointing at a hosted database cannot quietly be used instead.

# The API and the backup run the same image with the same settings; only the
# command differs.
x-api: &api
  image: pharmacy-api
  restart: unless-stopped
  env_file:
    - .env
  environment: &api-env
    NODE_ENV: production
    PORT: 5002
    DB_HOST: db
    DB_PORT: 5432
    # Postgres on the same private network, so no TLS to negotiate.
    DB_SSL: "false"
    BACKUP_DIR: /app/backups
    # pg_dump and pg_restore are on PATH in this image. Blanked so a Windows
    # path left in .env cannot send the backup looking for a C:\ drive.
    PG_DUMP_PATH: ""
    PG_RESTORE_PATH: ""
    # The shop's own clock, so "2 a.m." and the dates in log lines and dump
    # filenames all mean what the pharmacist would mean by them.
    TZ: Asia/Dhaka
  volumes:
    # Dumps outlive the containers; without this a rebuild throws them away.
    - ./backups:/app/backups

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: the API reaches it over Docker's own network, and a
    # machine that already runs Postgres would refuse to start the stack.
    # For psql or pgAdmin, either `docker compose exec db psql -U ...` or
    # uncomment this — 127.0.0.1 keeps it off the network either way.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *api
    build:
      context: .
    ports:
      - "5002:5002"
    depends_on:
      db:
        condition: service_healthy
    # Migrations, then the owner login, then the catalogue if it is still
    # empty. All three are safe to repeat, so every restart brings a freshly
    # pulled version of the schema up to date before the API answers anything.
    command: sh -c "npm run deploy:prepare && node dist/main"
    # The port only opens once migrations and seeds have finished, so this
    # answering means the database is ready for anything else to touch it.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('net').connect(5002,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m

  # One dump a night into ./backups, old ones pruned after BACKUP_KEEP_DAYS.
  # Separate from the API so a restart of one is not a restart of the other,
  # and so `docker compose logs backup` shows only this.
  backup:
    <<: *api
    environment:
      <<: *api-env
      # Hour of the Dhaka day to take it, when the shop is shut.
      BACKUP_HOUR: 2
    depends_on:
      # Not just started: on a fresh server the first dump would otherwise be
      # taken while the catalogue was still being imported.
      backend:
        condition: service_healthy
    command: sh docker/nightly-backup.sh

  # Every other day the dumps are copied to Google Drive, so a dead disk does
  # not take the database and its backups together. Idles with a message until
  # rclone is configured, which needs a browser and so cannot be automatic.
  offsite:
    image: rclone/rclone:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Dhaka
      RCLONE_CONFIG: /config/rclone/rclone.conf
      # e.g. gdrive:pharmacy-backups — the remote you named during setup.
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      OFFSITE_EVERY_DAYS: ${OFFSITE_EVERY_DAYS:-2}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-180}
    entrypoint: /bin/sh
    command: /scripts/offsite-backup.sh
    volumes:
      # Read-only: this only ever carries dumps away, never changes them.
      - ./backups:/backups:ro
      # Holds rclone.conf, which carries a Google token — keep it off git.
      - ./rclone:/config/rclone
      - ./docker:/scripts:ro
      # When it last succeeded, so a restart does not mean another upload.
      - offsite_state:/state

  frontend:
    build:
      context: ../pharmacy-fe
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka
      # Service name, not localhost: the counter screen is rendered on the
      # server and talks to the API across Docker's own network.
      API_BASE_URL: http://backend:5002
      # Turn on once something in front terminates HTTPS, or the session
      # cookie is refused by the browser.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "5001:5001"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  offsite_state:
